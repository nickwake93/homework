name: Remove PR report

# Deletes a PR's published Playwright report from GitHub Pages once the PR is closed or merged.
on:
  pull_request:
    types: [closed]

jobs:
  remove-report:
    name: Remove report
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Shared with ci.yml's publish job: both rewrite the gh-pages branch.
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github/scripts

      - name: Remove from GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if git ls-remote --exit-code --heads "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages > /dev/null; then
            .github/scripts/publish-report.sh remove "pr/$PR_NUMBER"
          fi
