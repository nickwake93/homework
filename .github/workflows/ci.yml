name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      trace_all:
        description: "Record a trace for every test, not just failures (much larger report)"
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  # A new push to a PR cancels the old run; on main every run finishes, so a deploy is never
  # cut off part-way.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Lint, typecheck & E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      report-key: ${{ steps.report.outputs.key }}
      report-url: ${{ steps.report.outputs.url }}
      # Only publish when tests actually ran (not e.g. when lint failed first).
      publish: ${{ steps.report.outputs.publish == 'true' && steps.summary.outputs.written == 'true' }}
    steps:
      - uses: actions/checkout@v5

      # Where this run's report is published: pr/<number>, main, or branch/<name>.
      - name: Work out report location
        id: report
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          if [ -n "$PR_NUMBER" ]; then
            key="pr/$PR_NUMBER"
          elif [ "$GITHUB_REF_NAME" = main ]; then
            key="main"
          else
            key="branch/${GITHUB_REF_NAME//[^A-Za-z0-9._-]/-}"
          fi
          # Fork PRs get a read-only token, so they can't publish.
          publish=true
          if [ -n "$HEAD_REPO" ] && [ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ]; then publish=false; fi
          echo "key=$key" >> "$GITHUB_OUTPUT"
          echo "url=https://${OWNER,,}.github.io/${REPO}/${key}/" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            playwright/package-lock.json

      - name: Install app dependencies
        run: npm ci

      - name: Install test dependencies
        working-directory: playwright
        run: npm ci

      - name: Lint app
        run: npm run lint

      - name: Typecheck app
        run: npm run typecheck

      - name: Check app formatting
        run: npm run format:check

      - name: Lint tests
        working-directory: playwright
        run: npm run lint

      - name: Typecheck tests
        working-directory: playwright
        run: npm run typecheck

      - name: Check test formatting
        working-directory: playwright
        run: npm run format:check

      - name: Install Playwright browsers
        working-directory: playwright
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Build app
        run: npm run build

      # A quick gate: the critical-path tests in one browser. If the app is broken, this fails
      # in seconds and the full suite (and its minutes) is skipped.
      - name: Run smoke tests
        id: smoke
        working-directory: playwright
        env:
          PW_PREBUILT: "true"
          PW_TRACE: ${{ inputs.trace_all && 'on' || '' }}
        run: npm run test:smoke -- --project chromium

      # Every project, smoke tests included, so the published report is the complete picture.
      - name: Run full suite
        working-directory: playwright
        env:
          PW_PREBUILT: "true"
          PW_TRACE: ${{ inputs.trace_all && 'on' || '' }}
        run: npm test

      # The summary goes on the run page and in the PR comment, and is published with the
      # report (results.json too) so the reports index can show each one's status.
      - name: Write test summary
        id: summary
        if: ${{ !cancelled() && hashFiles('playwright/test-results/results.json') != '' }}
        working-directory: playwright
        env:
          REPORT_URL: ${{ steps.report.outputs.publish == 'true' && steps.report.outputs.url || '' }}
          # When the smoke gate failed, the results are from the smoke run alone.
          SMOKE_ONLY: ${{ steps.smoke.outcome == 'failure' }}
        run: |
          node scripts/report-summary.mjs test-results/results.json "$REPORT_URL" > playwright-report/summary.md
          cp test-results/results.json playwright-report/
          cat playwright-report/summary.md >> "$GITHUB_STEP_SUMMARY"
          echo "written=true" >> "$GITHUB_OUTPUT"

      - name: Upload HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright/playwright-report/
          retention-days: 14

  publish-report:
    name: Publish report
    needs: test
    if: ${{ !cancelled() && needs.test.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # push to gh-pages
      pull-requests: write # comment the report link
    # Shared with report-cleanup.yml: both rewrite the gh-pages branch.
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      KEY: ${{ needs.test.outputs.report-key }}
      URL: ${{ needs.test.outputs.report-url }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github/scripts

      - uses: actions/download-artifact@v4
        with:
          name: playwright-report
          path: report

      - name: Publish to GitHub Pages
        run: |
          .github/scripts/publish-report.sh publish "$KEY" report
          echo "Report published to $URL (GitHub Pages can take a minute to update)." >> "$GITHUB_STEP_SUMMARY"

      # One comment per PR, edited on each push rather than adding a new one.
      - name: Comment on the PR
        if: ${{ github.event_name == 'pull_request' }}
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          marker="<!-- playwright-report -->"
          {
            echo "$marker"
            cat report/summary.md 2>/dev/null || echo "## Playwright: no results (the run failed before tests finished)"
            echo
            echo "<sub>For ${HEAD_SHA::7}. Pages can take a minute to update. All reports: https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/</sub>"
          } > comment.md
          id="$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
            -q ".[] | select(.body | startswith(\"$marker\")) | .id" | head -n 1)"
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@comment.md > /dev/null
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" -F body=@comment.md > /dev/null
          fi

  deploy:
    name: Deploy to Cloudflare
    needs: test
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://photos.nickwake.uk/
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install app dependencies
        run: npm ci

      # The same Worker build the tests ran against in the test job.
      - name: Build app
        run: npm run build

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy

  smoke-production:
    name: Smoke test production
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PLAYWRIGHT_BASE_URL: https://photos.nickwake.uk/
      PLAYWRIGHT_TARGET: production
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: playwright/package-lock.json

      - name: Install test dependencies
        working-directory: playwright
        run: npm ci

      - name: Install Playwright browsers
        working-directory: playwright
        run: npx playwright install --with-deps chromium firefox webkit

      # A new custom domain can take a few minutes to get its certificate.
      - name: Wait for the site
        run: |
          for _ in $(seq 1 30); do
            curl -sf -o /dev/null "$PLAYWRIGHT_BASE_URL" && exit 0
            sleep 10
          done
          echo "::error::$PLAYWRIGHT_BASE_URL didn't respond within 5 minutes"
          exit 1

      # Read-only checks: critical paths in every browser, and that the test API is off.
      - name: Run smoke tests
        working-directory: playwright
        run: npm run test:smoke

      - name: Write test summary
        if: ${{ !cancelled() && hashFiles('playwright/test-results/results.json') != '' }}
        working-directory: playwright
        run: node scripts/report-summary.mjs test-results/results.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-production
          path: playwright/playwright-report/
          retention-days: 14
